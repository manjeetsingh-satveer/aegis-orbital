version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      # Framework upgrades land together; React and Next are coupled.
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom', 'eslint-config-next']
      # Tooling churn is noisy and low risk — batch it.
      dev-tooling:
        patterns: ['vitest', '@vitest/*', '@playwright/*', 'eslint', 'typescript', 'tsx', '@types/*']
        exclude-patterns: ['@types/react', '@types/react-dom']
    ignore:
      # Overridden deliberately to patched releases (see package.json
      # "overrides"); Dependabot must not fight those pins.
      - dependency-name: postcss
        update-types: ['version-update:semver-major']
      - dependency-name: sharp
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
